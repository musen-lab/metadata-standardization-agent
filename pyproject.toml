[project]
name = "metadata-standardization-agent"
version = "0.1.0"
description = "Evaluation harness and supplementary material for the ARMS metadata standardization agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "BSD-2-Clause" }
authors = [
    { name = "Josef Hardi" },
]

dependencies = [
    "arms-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# The harness is not a distribution.  Its code lives in evaluation/, which the
# notebook, the CLI, and the tests put on sys.path by directory rather than
# import as an installed package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["arms-agent"]

[tool.uv.sources]
arms-agent = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["evaluation", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
# Each condition's prompt copies shared blocks verbatim from the agent's system
# prompt and must not be rewrapped.
"evaluation/conditions/prompt_only/prompts/*.py" = ["E501", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["arms_agent"]

[tool.pytest.ini_options]
# The whole suite from the root; arms-agent/pyproject.toml runs its half on its own.
testpaths = ["tests", "arms-agent/tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.1",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]
